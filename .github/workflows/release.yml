name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version for a manual run
        required: false
        type: string
      dry_run:
        description: Build artifacts without committing, tagging, or publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  models: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER: ${{ secrets.AC_API_ISSUER }}
      AC_API_KEY: ${{ secrets.AC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve or cut the release version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
            echo "OBOL_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "error: publishing is automatic only for main; run again with dry_run enabled for other branches" >&2
              exit 1
            fi
            VERSION="$(node -p 'require("./package.json").version')"
            MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
            MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
            PATCH="$(printf '%s' "$VERSION" | cut -d. -f3)"
            # Decide the bump from every commit since the previous release:
            # BREAKING CHANGE or type!: major, feat: minor, anything else patch.
            PREV_TAG="$(git tag --list 'v*' --sort=-creatordate | head -1 || true)"
            echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
            if [ -n "$PREV_TAG" ]; then LOG_RANGE="$PREV_TAG..HEAD"; else LOG_RANGE="HEAD"; fi
            SUBJECTS="$(git log --no-merges --pretty=%s "$LOG_RANGE")"
            [ -n "$SUBJECTS" ] || SUBJECTS="$(git log -1 --pretty=%s)"
            LEVEL="patch"
            if printf '%s\n' "$SUBJECTS" | grep -Eqi '\[major\]|BREAKING[ -]CHANGE|^[a-z]+(\([^)]*\))?!:'; then
              LEVEL="major"
            elif printf '%s\n' "$SUBJECTS" | grep -Eqi '\[minor\]|^\s*(feat|feature)(\(|:)'; then
              LEVEL="minor"
            fi
            case "$LEVEL" in
              major) NEXT="$((MAJOR + 1)).0.0" ;;
              minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            if [ -n "${{ inputs.version }}" ]; then
              NEXT="${{ inputs.version }}"
            fi
            echo "Bump level: $LEVEL ($VERSION -> $NEXT)"
            echo "OBOL_VERSION=$NEXT" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$NEXT" >> "$GITHUB_ENV"
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              ./scripts/set-version.sh "$NEXT"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "chore(release): v$NEXT"
              git push origin "HEAD:main"
              git tag "v$NEXT"
              git push origin "v$NEXT"
            else
              # Stamp locally so the dry-run build carries the candidate version.
              ./scripts/set-version.sh "$NEXT"
            fi
          fi
      - name: Check version before building
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./scripts/check-version.sh
          else
            GITHUB_REF_NAME="$RELEASE_TAG" ./scripts/check-version.sh
          fi
      - run: npm ci
      - name: Add both Darwin ccusage runtimes
        run: |
          npm install --no-save --force \
            @ccusage/ccusage-darwin-arm64@20.0.20 \
            @ccusage/ccusage-darwin-x64@20.0.20 \
            --os=darwin --cpu=arm64
          test -d node_modules/@ccusage/ccusage-darwin-arm64
          test -d node_modules/@ccusage/ccusage-darwin-x64
      - name: Import Developer ID certificate (untested)
        if: env.MACOS_CERTIFICATE != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/obol-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/obol-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
      - name: Build and package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          npm run build
          OBOL_VERSION="$OBOL_VERSION" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" npm run package:dmg
      - name: Verify release artifacts
        run: |
          test -f "dist/Obol-$OBOL_VERSION.dmg"
          test -f "dist/Obol-$OBOL_VERSION.zip"
          test -f dist/SHA256SUMS
          lipo -info ".xcodebuild/Build/Products/Release/Obol.app/Contents/MacOS/Obol" | grep -q arm64
          lipo -info ".xcodebuild/Build/Products/Release/Obol.app/Contents/MacOS/Obol" | grep -q x86_64
          unzip -l "dist/Obol-$OBOL_VERSION.zip" | grep -q ccusage-darwin-x64
          (cd dist && shasum -c SHA256SUMS)
      - name: Publish stable-name DMG for the latest download link
        run: |
          # /releases/latest/download/Obol.dmg always resolves to the newest
          # release's copy, giving the README a permanent download URL.
          cp "dist/Obol-$OBOL_VERSION.dmg" dist/Obol.dmg
          (cd dist && shasum -a 256 Obol.dmg >> SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: inputs.dry_run == true
        with:
          name: Obol-${{ env.OBOL_VERSION }}
          path: |
            dist/Obol-*.dmg
            dist/Obol.dmg
            dist/Obol-*.zip
            dist/SHA256SUMS
      - name: Draft release notes with GitHub Models
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_MODEL: openai/gpt-4o-mini
        run: |
          set -eu
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          PREV_TAG="${PREV_TAG:-$(git tag --list 'v*' --sort=-creatordate | sed "/^${RELEASE_TAG}\$/d" | head -1 || true)}"
          if [ -n "$PREV_TAG" ]; then LOG_RANGE="$PREV_TAG..HEAD"; else LOG_RANGE="HEAD"; fi
          COMMITS="$(git log --no-merges --pretty=format:'- %s' "$LOG_RANGE" | head -60)"
          [ -n "$COMMITS" ] || COMMITS="- Maintenance and dependency updates"

          PAYLOAD="$(jq -n \
            --arg model "$GH_MODEL" \
            --arg system 'You write release notes for Obol, a macOS menu bar app that tracks AI coding-agent spend. From the commit list, write 3 to 6 concise markdown bullets describing user-facing changes. Plain bullets only: no headings, no commit hashes, no version numbers. Skip chores and CI-only changes unless they affect users.' \
            --arg commits "$COMMITS" \
            '{model: $model, messages: [{role: "system", content: $system}, {role: "user", content: $commits}], max_tokens: 400}')"

          # Free GitHub Models inference; any failure falls back to raw commits.
          if AI_TEXT="$(curl -sf --max-time 30 https://models.github.ai/inference/chat/completions \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" | jq -r '.choices[0].message.content // empty' 2>/dev/null)" && [ -n "$AI_TEXT" ]; then
            printf '%s\n' "$AI_TEXT" > "$RUNNER_TEMP/ai-section.md"
          else
            printf '%s\n' "$COMMITS" > "$RUNNER_TEMP/ai-section.md"
          fi

          {
            echo "## What's new"
            cat "$RUNNER_TEMP/ai-section.md"
            echo
            echo "---"
            echo "**Download \`Obol-$OBOL_VERSION.dmg\` below**, open it, and drag Obol to Applications."
            echo "First launch on another Mac needs right-click -> Open (ad-hoc signed). Node.js 20+ required. Verify with \`cd dist && shasum -c SHA256SUMS\`."
          } > "$NOTES_FILE"
      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Obol-*.dmg
            dist/Obol.dmg
            dist/Obol-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          append_body: true
          body_path: ${{ runner.temp }}/release-notes.md
