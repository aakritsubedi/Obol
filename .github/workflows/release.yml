name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version for a manual run
        required: false
        type: string
      dry_run:
        description: Build artifacts without committing, tagging, or publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER: ${{ secrets.AC_API_ISSUER }}
      AC_API_KEY: ${{ secrets.AC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Resolve or cut the release version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
            echo "OBOL_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "error: publishing is automatic only for main; run again with dry_run enabled for other branches" >&2
              exit 1
            fi
            VERSION="$(node -p 'require("./package.json").version')"
            MAJOR="$(printf '%s' "$VERSION" | cut -d. -f1)"
            MINOR="$(printf '%s' "$VERSION" | cut -d. -f2)"
            PATCH="$(printf '%s' "$VERSION" | cut -d. -f3)"
            SUBJECT="$(git log -1 --pretty=%s)"
            case "$SUBJECT" in
              *"[major]"*) NEXT="$((MAJOR + 1)).0.0" ;;
              *"[minor]"*) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
              *)           NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            if [ -n "${{ inputs.version }}" ]; then
              NEXT="${{ inputs.version }}"
            fi
            echo "OBOL_VERSION=$NEXT" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v$NEXT" >> "$GITHUB_ENV"
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              ./scripts/set-version.sh "$NEXT"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -m "chore(release): v$NEXT"
              git push origin "HEAD:main"
              git tag "v$NEXT"
              git push origin "v$NEXT"
            else
              # Stamp locally so the dry-run build carries the candidate version.
              ./scripts/set-version.sh "$NEXT"
            fi
          fi
      - name: Check version before building
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ./scripts/check-version.sh
          else
            GITHUB_REF_NAME="$RELEASE_TAG" ./scripts/check-version.sh
          fi
      - run: npm ci
      - name: Add both Darwin ccusage runtimes
        run: |
          npm install --no-save --force \
            @ccusage/ccusage-darwin-arm64@20.0.20 \
            @ccusage/ccusage-darwin-x64@20.0.20 \
            --os=darwin --cpu=arm64
          test -d node_modules/@ccusage/ccusage-darwin-arm64
          test -d node_modules/@ccusage/ccusage-darwin-x64
      - name: Import Developer ID certificate (untested)
        if: env.MACOS_CERTIFICATE != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/obol-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/obol-signing.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
      - name: Build and package
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          npm run build
          OBOL_VERSION="$OBOL_VERSION" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" npm run package:dmg
      - name: Verify release artifacts
        run: |
          test -f "dist/Obol-$OBOL_VERSION.dmg"
          test -f "dist/Obol-$OBOL_VERSION.zip"
          test -f dist/SHA256SUMS
          lipo -info ".xcodebuild/Build/Products/Release/Obol.app/Contents/MacOS/Obol" | grep -q arm64
          lipo -info ".xcodebuild/Build/Products/Release/Obol.app/Contents/MacOS/Obol" | grep -q x86_64
          unzip -l "dist/Obol-$OBOL_VERSION.zip" | grep -q ccusage-darwin-x64
          (cd dist && shasum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: inputs.dry_run == true
        with:
          name: Obol-${{ env.OBOL_VERSION }}
          path: |
            dist/Obol-*.dmg
            dist/Obol-*.zip
            dist/SHA256SUMS
      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Obol-*.dmg
            dist/Obol-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          append_body: true
          body: |

            ---
            The app needs Node.js 20+ at /opt/homebrew/bin/node, /usr/local/bin/node, /opt/local/bin/node, /usr/bin/node, ~/.volta/bin/node, or inside nvm/mise/fnm folders. The first launch of the ad-hoc-signed DMG on another Mac needs right-click -> Open; in-app updates download the ZIP and skip that quarantine prompt after their integrity checks. Verify a download with:

                cd dist && shasum -c SHA256SUMS
