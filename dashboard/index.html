<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Obol</title>
    <script>
      // Stamp the saved theme before first paint. React mounts too late: a
      // dark-mode user with the light theme saved would see a white flash.
      // Keep the storage key and attribute in sync with src/theme.ts.
      (function () {
        try {
          var saved = localStorage.getItem("obol-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
            document.documentElement.style.colorScheme = saved;
          }
        } catch (error) {
          /* Storage is unavailable; the OS preference still applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
